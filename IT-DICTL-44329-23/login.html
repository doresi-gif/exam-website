<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dorizel Institute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Dorizel Institute</h1>
    </header>

    <main>
        <section>
            <h2>Student Login</h2>
            <form action="#" method="POST">
                
                <p>
                    <label for="login-user">Email or Username:</label><br>
                    <input type="text" id="login-user" name="username_email" placeholder="Enter username or email" required>
                </p>

                <p>
                    <label for="login-pass">Password:</label><br>
                    <input type="password" id="login-pass" name="password" placeholder="Enter password" required>
                </p>

                <p>
                    <label>
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                </p>

                <p>
                    <input type="submit" value="Login">
                </p>

                <p>
                    <a href="#">Forgot password?</a>
                </p>

                <p>
                    New student? <a href="register.html">Create an account here</a>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dorizel Institute. All rights reserved.</p>
    </footer>

</body>
</html>
