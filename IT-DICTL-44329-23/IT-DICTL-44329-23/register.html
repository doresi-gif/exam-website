<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Registration</title>
    
</head>
<body>

        <header>
        <h1>Dorizel Institute</h1>
    </header>

    <div class="container">

         <main>
        <section>
        
        <h2>student Registration</h2>
        <form>
            <div>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. +254 712 345 678" required>
            </div>
            <div>
            <label for="course">Select Course</label>
            <select id="course" name="course" required>
                <option value="">-- Choose a course --</option>
                <option value="ict">ICT & Computer Studies</option>
                <option value="business">Business Management</option>
                <option value="engineering">Engineering</option>
                <option value="hospitality">Hospitality & Tourism</option>
            </select>
            </div>
            <div>
            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <div>
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required>
            </div>
            <div>
            <button type="submit">Register</button>
            </div>
    
        </form>
        <div class="footer">
            Already have an account? <a href="#">Login here</a>
        </div>
    </div>
        </section>
        </main>

        <footer>
        <p>&copy; 2026 Dorizel Institute. All rights reserved.</p>
    </footer>

</body>
</html>
